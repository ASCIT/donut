{% extends "layout.html" %}
{% block page %}

<div class="container theme-showcase" role="main">
  <h1>Database Explorer</h1>
  <p>
    <a class="btn btn-default" href="{{ url_for('db_admin.logs') }}">Audit Log</a>
  </p>
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Table</th>
        <th>Rows (approx.)</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for table in tables %}
      <tr>
        <td><strong>{{ table.name }}</strong>{% if table.read_only %} <span class="label label-warning">read-only</span>{% endif %}</td>
        <td>{{ table.rows if table.rows is not none else '?' }}</td>
        <td class="text-right">
          <a class="btn btn-sm btn-primary" href="{{ url_for('db_admin.browse', table=table.name) }}">Browse</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
